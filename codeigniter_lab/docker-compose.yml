# CodeIgniter Config Leak Field-Prove Lab — docker-compose
# One IP (127.0.0.1), Host-header vhosts, TLS self-signed lab CA.
# nginx serves static docroots: vuln.codeigniter.lab exposes
# /application/config/database.php with a planted DB password;
# hardened.codeigniter.lab serves the same app shape but denies access
# to the config path (true-negative).

services:
  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8444:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./sites:/etc/nginx/sites:ro
    restart: unless-stopped
