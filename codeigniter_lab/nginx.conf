worker_processes auto;
events { worker_connections 1024; }

http {
    access_log /var/log/nginx/access.log;

    ssl_certificate     /etc/nginx/certs/codeigniter-lab.crt;
    ssl_certificate_key /etc/nginx/certs/codeigniter-lab.key;

    index index.html;

    # vuln.codeigniter.lab — CI marker on root, config source exposed.
    server {
        listen 443 ssl;
        server_name vuln.codeigniter.lab;
        root /etc/nginx/sites/vuln;

        # Set the CI session cookie on every response so fingerprint_all
        # sees a CodeIgniter marker.
        add_header Set-Cookie "ci_session=lababcdef123456" always;

        # Expose PHP source as plain text (misconfig).
        location ~* /application/config/.*\.php$ {
            default_type text/plain;
            add_header Set-Cookie "ci_session=lababcdef123456" always;
        }

        location / { try_files $uri $uri/ =404; }
    }

    # hardened.codeigniter.lab — same app, config path denied.
    server {
        listen 443 ssl;
        server_name hardened.codeigniter.lab;
        root /etc/nginx/sites/hardened;

        # No CI cookie; no CSRF marker. Generic HTML.

        # Deny config access (the path doesn't exist anyway, but explicit).
        location ~* /application/config/.*\.php$ { return 404; }

        location / { try_files $uri $uri/ =404; }
    }
}
