name: PR Agent AI Reviewer (DeepSeek)

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  pr_agent:
    name: PR Agent AI Review
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.draft == false || (github.event.comment != null && startsWith(github.event.comment.body, '/')) }}
    steps:
      - name: Run PR Agent
        uses: qodo-ai/pr-agent@main
        env:
          OPENAI_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_BASE_URL: "https://api.deepseek.com"
          CONFIG.MODEL: "deepseek/deepseek-reasoner"
          CONFIG.FALLBACK_MODELS: '[]'
          DEEPSEEK.KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_REVIEWER.REQUIRE_ALL_CHECKS: "false"
          PR_REVIEWER.NUM_CODE_SUGGESTIONS: 4
          PR_REVIEWER.ENABLE_HELP_TEXT: "true"
