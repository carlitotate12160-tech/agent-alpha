# CANONICAL known-default credential catalog — the SINGLE source (anti-Lyndon #7).
# Public, well-known vendor/platform defaults ONLY. NEVER recon-harvested secrets.
# Bounded per platform (NOT a spray wordlist). Consumed by:
#   * default_creds._build_credential_list  (generic + matched platforms)
#   * odoo_access._assemble_candidates       (odoo platform entry only)
# Do NOT re-declare these pairs inline in any tool body — one source, this file.
#
# Keys are matched as SUBSTRINGS against the target's tech_stack values (lowercased),
# so a key must equal a tech_stack label (e.g. "wp" = constants.STACK_WP). "generic"
# is ALWAYS included by credentials_for(); platform keys are additive when matched.

default_credentials:
  generic:
    - [admin, admin]
    - [admin, password]
    - [admin, admin123]
    - [root, root]
    - [root, toor]
    - [test, test]
    - [user, user]
    - [guest, guest]
  wp:
    - [admin, admin]
    - [admin, password]
  tomcat:
    - [tomcat, tomcat]
    - [admin, admin]
    - [manager, manager]
  jenkins:
    - [admin, admin]
  phpmyadmin:
    - [root, ""]
    - [root, root]
  grafana:
    - [admin, admin]
  joomla:
    - [admin, admin]
  # odoo defaults were orphaned inline in odoo_access._assemble_candidates (GAP: #7
  # divergence — odoo had no entry in the main catalog). Now single-sourced here.
  odoo:
    - [admin, admin]
    - [admin, password]
