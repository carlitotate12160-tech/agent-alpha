# Class-C CoverageLedger diagnostic example config.
#
# Consumed by: agent_alpha/live_fire/coverage_diagnostic.py
#
# This diagnostic is read-only by default (Mode A).  It loads persisted events
# for each engagement_id and projects the finding funnel from the event stream.
#
# Mode A — list engagement_ids only (zero target touch):
#   python -m agent_alpha.live_fire.coverage_diagnostic this.yaml
#
# Mode B — only if every engagement_id has NO events AND the store is
# InMemoryEventStore, you MUST pass --allow-live-touch.  The diagnostic then
# performs ONE bounded recon run per target and projects the funnel from the
# resulting events.  Targets must be in agent_alpha/live_fire/lab_guard._LAB_HOSTS.
#
# Mode A: replay from persisted events (production store: Postgres or InMemory)
engagement_ids:
  - "eng_xxxxxxxx"   # WP target
  - "eng_yyyyyyyy"   # non-WP target
  - "eng_zzzzzzzz"   # full-CF target

# Optional: exclude specific techniques from coverage projection (used by tests
# to force a cardinal RED S5 "all applicable cells are capability_absent" case).
excluded_techniques: []

# Mode B: live target touch (only when no persisted events and --allow-live-touch)
targets:
  - client_id: "wp_lab"
    scope:
      ip_ranges: []
      domains:
        - "wp.alpha-ai.web.id"
      exclusions: []
    recon_url: "https://wp.alpha-ai.web.id/"
    ownership_tokens:
      "wp.alpha-ai.web.id": "5fd127953896afcb6bc19b0cfc434786"
    consent_items:
      - "authorized_recon"
      - "origin_discovery"
      - "subdomain_enum"
    signed_by: "natanael"
    signed_at: "2026-08-08T00:00:00Z"

  - client_id: "nonwp_lab"
    scope:
      ip_ranges: []
      domains:
        - "direct.alpha-ai.web.id"
      exclusions: []
    recon_url: "https://direct.alpha-ai.web.id/"
    ownership_tokens:
      "direct.alpha-ai.web.id": "2bc860d964b4719a759743cdd8f46105ed9f6dbd8023e7ee5874e985e5a908ef"
    consent_items:
      - "authorized_recon"
    signed_by: "natanael"
    signed_at: "2026-08-08T00:00:00Z"

  - client_id: "fullcf_lab"
    scope:
      ip_ranges: []
      domains:
        - "niagamas.com"
      exclusions: []
    recon_url: "https://niagamas.com/"
    ownership_tokens:
      "niagamas.com": "dns-txt:agent-alpha=client-approved"
    consent_items:
      - "authorized_recon"
      - "origin_discovery"
    signed_by: "natanael"
    signed_at: "2026-08-08T00:00:00Z"
