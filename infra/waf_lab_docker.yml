version: '3.8'

# ModSecurity + OWASP CRS v4 reverse proxy in front of chain_lab_app.py.
# Purpose: measure agent stealth (anomaly score, rule triggers, block ratio).
#
# Architecture:
#   Agent → ModSecurity WAF (port 9080) → chain_lab target (internal port 80)
#
# Audit logs:
#   docker logs waf_lab-modsec-1 2>&1 | grep -i modsec
#   docker exec waf_lab-modsec-1 cat /var/log/modsec_audit.log
#
# Paranoia level: 1 (default). Set PARANOIA=2 or 3 for stricter detection.

services:
  modsec:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: waf_lab-modsec-1
    ports:
      - "127.0.0.1:9080:8080"
    environment:
      - BACKEND=http://waf_lab_target:80
      - PARANOIA=1
      - ANOMALY_INBOUND=5
      - MODSEC_AUDIT_LOG=/dev/stdout
      - MODSEC_AUDIT_LOG_FORMAT=JSON
      - MODSEC_AUDIT_ENGINE=On
      - MODSEC_AUDIT_LOG_TYPE=Serial
      - SERVER_NAME=waf.chain-lab.lab
      - ERRORLOG=/dev/stderr
      - ACCESSLOG=/dev/stdout
      - LOGLEVEL=warn
    depends_on:
      - target
    restart: unless-stopped

  target:
    image: python:3.12-slim
    container_name: waf_lab_target
    ports:
      - "127.0.0.1:9202:80"
    volumes:
      - ./chain_lab_app.py:/app/app.py:ro
    environment:
      - LEAKED_PASSWORD=s3cr3t-reuse-x9q2
      - LEAKED_USERNAME=admin
    command: >-
      sh -c "pip install flask &&
             python -c 'from flask import Flask; import sys; sys.path.insert(0, \"/app\"); from app import app; app.run(host=\"0.0.0.0\", port=80)'"
    restart: unless-stopped
