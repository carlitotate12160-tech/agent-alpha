# GitGuardian configuration (v2 format)
# Ignore false positives for lab fixtures and test files with fake credentials.
version: 2

secret:
  ignored_paths:
    - "infra/docker-compose.yml"
    - "infra/waf_lab_docker.yml"
    - "tests/phase_4/test_git_exposure_probe.py"
    - "tests/phase_4/test_git_exposure_wiring.py"
    - "tests/phase_4/test_wp_recon.py"
    - "recon_lab/exposed/late/.env.bak"
    - "recon_lab/exposed/decoy/.env.bak"
    # Real-world alpha-ai.web.id lab stacks — hardcoded non-secrets for
    # intentionally vulnerable or intentionally hardened target fixtures.
    - "laravel_real_lab/.env.example"
    - "laravel_real_lab/seed.sh"
    - "odoo_hardened_lab/docker-compose.yml"
    - "odoo_hardened_lab/odoo.conf"
    - "wp_real_lab/.env.example"
    - "wp_real_lab/seed.sh"

