worker_processes auto;
events { worker_connections 1024; }

http {
    access_log /var/log/nginx/access.log;

    ssl_certificate     /etc/nginx/certs/stack-internal.crt;
    ssl_certificate_key /etc/nginx/certs/stack-internal.key;

    # ── laravel.alpha-ai.web.id — debug mode enabled (leak vector) ──────
    server {
        listen 443 ssl;
        server_name laravel.alpha-ai.web.id;

        # All paths → Laravel Apache (debug mode leaks env on 500 errors)
        location / {
            proxy_pass http://laravel:80;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
