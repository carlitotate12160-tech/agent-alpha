worker_processes auto;
events { worker_connections 1024; }

http {
    access_log /var/log/nginx/access.log;

    ssl_certificate     /etc/nginx/certs/stack-internal.crt;
    ssl_certificate_key /etc/nginx/certs/stack-internal.key;

    # ── odoo.alpha-ai.web.id — hardened (no leak, unique password) ──────
    server {
        listen 443 ssl;
        server_name odoo.alpha-ai.web.id;

        # NO backup file paths exposed — no leak vector.
        # All paths → Odoo (access vector only, no cred to reuse)

        # Block common leak paths explicitly (hardened)
        location ~* /(wp-config|\.env|\.git|backup|\.bak) {
            return 404;
        }

        location / {
            proxy_pass http://odoo:8069;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Odoo XML-RPC endpoints
        location /xmlrpc/ {
            proxy_pass http://odoo:8069;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
