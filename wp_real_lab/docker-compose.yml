# WP Real-World Lab — wp.alpha-ai.web.id
# Deploy on Oracle ARM64 (168.110.192.62). Cloudflare-proxied (real WAF/TLS).
#
# Topology:
#   Internet → CF (real proxy/WAF) → Oracle:443 (front nginx) → 127.0.0.1:8443 (this stack)
#
# This stack binds to 127.0.0.1:8443 — NOT public. The front-facing nginx
# (see front_proxy.conf) proxies CF Origin traffic here by Host header.
#
# Chain: /wp-config.php.bak leak → DB creds → WP admin login (cred-reuse).
# Real CF WAF = managed challenge may block the leak path = true test of
# evasion + reach strategy (origin-direct, TLS impersonate).

services:
  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./exposed:/etc/nginx/exposed:ro
    depends_on:
      - wordpress
    restart: unless-stopped

  wordpress:
    image: wordpress:apache
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_NAME: ${MARIADB_DATABASE}
      WORDPRESS_DB_USER: ${MARIADB_USER}
      WORDPRESS_DB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - wp_html:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  wpcli:
    image: wordpress:cli
    entrypoint: ["sleep", "infinity"]
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_NAME: ${MARIADB_DATABASE}
      WORDPRESS_DB_USER: ${MARIADB_USER}
      WORDPRESS_DB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - wp_html:/var/www/html
    depends_on:
      - wordpress
    restart: unless-stopped

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  wp_html:
  mariadb_data:
