# Front-facing nginx config for alpha-ai.web.id real-world labs.
# Install on Oracle ARM64 at /etc/nginx/sites-available/alpha-ai-labs.conf
# then: sudo ln -s /etc/nginx/sites-available/alpha-ai-labs.conf /etc/nginx/sites-enabled/
#
# This nginx listens on :443 (public) and routes by Host header to
# internal stack ports. CF Origin cert covers *.alpha-ai.web.id.
#
# CF Origin cert: download from Cloudflare dashboard → SSL/TLS →
# Origin Server → Create Certificate (RSA, 15 years, *.alpha-ai.web.id).
# Install at /etc/nginx/certs/origin.pem + /etc/nginx/certs/origin.key.

# ── wp.alpha-ai.web.id → WP stack (127.0.0.1:8443) ────────────────────
server {
    listen 443 ssl http2;
    server_name wp.alpha-ai.web.id;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_verify off;  # internal self-signed cert
    }
}

# ── laravel.alpha-ai.web.id → Laravel stack (127.0.0.1:8444) ──────────
