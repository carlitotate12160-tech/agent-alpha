worker_processes auto;
events { worker_connections 1024; }

http {
    access_log /var/log/nginx/access.log;

    # ── Internal TLS (self-signed for stack-internal; front proxy terminates CF Origin) ──
    # The front-facing nginx on Oracle:443 uses the real CF Origin cert.
    # This internal nginx uses a self-signed cert — traffic between front proxy
    # and this stack never leaves localhost.
    ssl_certificate     /etc/nginx/certs/stack-internal.crt;
    ssl_certificate_key /etc/nginx/certs/stack-internal.key;

    # ── wp.alpha-ai.web.id — vuln: wp-config.php.bak exposed (leak vector) ──
    server {
        listen 443 ssl;
        server_name wp.alpha-ai.web.id;

        # Leak vector: exposed backup with valid DB creds
        location /wp-config.php.bak {
            alias /etc/nginx/exposed/vuln/wp-config.php.bak;
            default_type text/plain;
        }

        # All other paths → WordPress
        location / {
            proxy_pass http://wordpress:80;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
